# ===================================================================
# StressLess - Stress Relief and Mental Wellness Platform
# Spring Boot Configuration
# ===================================================================

server.port=8081
spring.application.name=stressless-backend

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/stressless_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT Security Configuration
stressless.app.jwtSecret=StressLessSecretKeyForMentalWellnessPlatformSecureTokenSigning2025!VeryLongKeyRequiredForHmacSHA256
stressless.app.jwtExpirationMs=86400000

# CORS Configuration
stressless.app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200,http://localhost:3000

# Logging Configuration
logging.level.org.springframework.security=INFO
logging.level.com.stressless=DEBUG
